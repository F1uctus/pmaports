# Drive the MSM8916 PCM from its period interrupts. On MSM8939 the audio DSP
# stops answering APR after a while when PipeWire writes on its own timer.
monitor.alsa.rules = [
	{
		matches = [
			{
				node.name = "~alsa_(input|output).platform-7702000.*"
			}
		]
		actions = {
			update-props = {
				api.alsa.disable-tsched = true
			}
		}
	}
]
